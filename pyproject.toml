[project]
name = "huggingface-evaluate-layout-metrics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["evaluate[template]", "huggingface_hub"]

[dependency-groups]
dev = [
    "einops==0.8.1",
    "mypy>=1.0.0",
    "prdc==0.2",
    "pytest>=6.0.0",
    "ruff>=0.1.5",
    "torch>=2.0.0",
    "torch-geometric==2.7.0",
]

[tool.uv.workspace]
members = ["metrics/*"]

[tool.uv.sources]
evaluate = { git = "https://github.com/huggingface/evaluate", rev = "7c4656a407213b71cb7e6f6634b7935c18f5140d" }

[tool.ruff]
extend-exclude = ["vendor"]

[tool.mypy]
python_version = "3.11"
exclude = "^vendor/"
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
norecursedirs = ["vendor"]
